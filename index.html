<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1on1 マスターAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f7f6f2;color:#2a2520;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{padding:14px 16px 0;border-bottom:1px solid #e0dbd2;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-icon{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#b8956a,#8a6a3e);display:flex;align-items:center;justify-content:center;font-size:19px}
.logo-text h1{font-size:15px;font-weight:700;color:#8a6a3e}
.logo-text p{font-size:9px;color:#b0a898}
.tabs{display:flex}
.tab{flex:1;padding:9px 0;background:none;border:none;border-bottom:2.5px solid transparent;color:#b0a898;font-size:13px;cursor:pointer;font-weight:400}
.tab.active{border-bottom-color:#b8956a;color:#8a6a3e;font-weight:700}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:16px}
.intro{font-size:13px;color:#7a7268;margin-bottom:16px;padding:10px 14px;background:#faf3e8;border-radius:10px;border:1px solid #e0dbd2;line-height:1.8}
.section{margin-bottom:18px}
.section-label{font-size:12px;color:#7a7268;margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:6px 12px;border-radius:20px;font-size:11.5px;cursor:pointer;background:#f2f0eb;border:1.5px solid #e0dbd2;color:#7a7268;transition:all .15s}
.chip.selected{background:#faf3e8;border-color:#b8956a;color:#8a6a3e;font-weight:700}
.btn{width:100%;padding:14px 0;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-gold{background:linear-gradient(135deg,#b8956a,#8a6a3e);color:#fff;box-shadow:0 4px 16px rgba(184,149,106,.3)}
.btn-gray{background:#e0dbd2;color:#b0a898;cursor:not-allowed}
.chat-area{flex:1;overflow-y:auto;padding:16px}
.bubble{display:flex;margin-bottom:12px;animation:fadeUp .25s ease}
.bubble.user{justify-content:flex-end}
.bubble-content{max-width:82%;padding:10px 14px;font-size:13px;line-height:1.8;white-space:pre-wrap;border-radius:16px 16px 16px 4px;background:#fff;border:1px solid #e0dbd2}
.bubble.user .bubble-content{border-radius:16px 16px 4px 16px;background:#2d4a3e;color:#e8f5ee;border:none}
.input-bar{padding:10px 12px;border-top:1px solid #e0dbd2;background:#fff}
.input-row{display:flex;gap:8px}
.input-row textarea{flex:1;background:#f2f0eb;border:1.5px solid #e0dbd2;border-radius:12px;color:#2a2520;padding:9px 12px;font-size:13px;resize:none;outline:none;line-height:1.5;font-family:sans-serif}
.input-row button{width:44px;height:44px;border-radius:12px;border:none;font-size:20px;cursor:pointer;align-self:flex-end;color:#fff}
.btn-send{background:#b8956a}
.btn-send:disabled{background:#e0dbd2;cursor:not-allowed}
.progress-bar{padding:5px 14px;background:#f2f0eb;border-bottom:1px solid #e0dbd2}
.progress-bar p{font-size:10px;color:#b0a898;margin-bottom:3px}
.progress-track{height:4px;background:#e0dbd2;border-radius:2px}
.progress-fill{height:100%;background:linear-gradient(90deg,#b8956a,#8a6a3e);border-radius:2px;transition:width .4s}
.end-btns{padding:14px;display:flex;gap:8px}
.btn-outline{flex:1;padding:12px 0;background:#fff;border:1.5px solid #e0dbd2;border-radius:12px;color:#7a7268;font-size:12px;font-weight:600;cursor:pointer}
.btn-sm-gold{flex:1;padding:12px 0;background:linear-gradient(135deg,#b8956a,#8a6a3e);border:none;border-radius:12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">&#x1F9ED;</div>
    <div class="logo-text">
      <h1>1on1 マスターAI</h1>
      <p>成功循環モデル x マズロー心理学</p>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('design')">トーク設計</button>
    <button class="tab" onclick="switchTab('role')">ロールプレイ</button>
  </div>
</div>

<!-- トーク設計 -->
<div id="design" class="screen active">
  <div class="scroll" id="design-scroll">
    <div class="intro">部下のペルソナを設定してください。<br>設定内容はトーク設計・ロールプレイ両方に使われます。</div>
    <div class="section">
      <div class="section-label">業種</div>
      <div class="chips" id="chips-industry"></div>
    </div>
    <div class="section">
      <div class="section-label">職種</div>
      <div class="chips" id="chips-job"></div>
    </div>
    <div class="section">
      <div class="section-label">ポジション</div>
      <div class="chips" id="chips-position"></div>
    </div>
    <div class="section">
      <div class="section-label">年齢層</div>
      <div class="chips" id="chips-age"></div>
    </div>
    <div class="section">
      <div class="section-label">性格・タイプ（複数可）</div>
      <div class="chips" id="chips-personality"></div>
    </div>
    <div class="section">
      <div class="section-label">最近の状況（複数可）</div>
      <div class="chips" id="chips-issue"></div>
    </div>
    <button class="btn btn-gray" id="start-btn" onclick="startSession()">全項目を選んでください</button>
    <div style="height:16px"></div>
  </div>
  <div id="design-chat" style="display:none;flex:1;flex-direction:column">
    <div class="chat-area" id="design-messages"></div>
    <div class="input-bar">
      <div class="input-row">
        <textarea id="design-input" rows="2" placeholder="追加質問を..."></textarea>
        <button class="btn-send" onclick="sendDesign()">&#8593;</button>
      </div>
    </div>
  </div>
</div>

<!-- ロールプレイ -->
<div id="role" class="screen">
  <div id="role-chat" style="flex:1;flex-direction:column;display:flex">
    <div class="progress-bar" id="progress-bar">
      <p id="progress-text">まずトーク設計でペルソナを設定してください</p>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="chat-area" id="role-messages"></div>
    <div id="role-input-area" class="input-bar">
      <div class="input-row">
        <textarea id="role-input" rows="2" placeholder="部下に話しかけてみて..."></textarea>
        <button class="btn-send" onclick="sendRole()">&#8593;</button>
      </div>
    </div>
    <div id="role-end-btns" class="end-btns" style="display:none">
      <button class="btn-outline" onclick="retryRole()">同じペルソナで再挑戦</button>
      <button class="btn-sm-gold" onclick="resetAll()">ペルソナ変更</button>
    </div>
  </div>
</div>

<script>
var OPTS = {
  industry:["製造・建設","IT・テック","営業・小売","医療・介護","金融・保険","飲食・サービス","教育","公務員・行政","物流・運送","広告・PR","コンサルティング","人材・派遣"],
  job:["法人営業","ルート営業","エンジニア","事務・管理","人事・採用","マーケター","生産管理","施工管理","看護師","介護士","販売員","コンサルタント","教師・講師"],
  position:["新入社員(1年目)","若手(2〜4年目)","中堅(5〜9年目)","シニア・主任クラス","もうすぐ管理職","牽引層・リーダー候補","ベテラン・専門職"],
  age:["20〜24歳","25〜29歳","30〜34歳","35〜39歳","40〜44歳","45歳以上"],
  personality:["真面目・完璧主義","明るいが詰めが甘い","内向的・慎重派","反発しやすい","やる気が見えない","優秀だが孤立しがち","感情的になりやすい","素直だが自信がない","受け身・指示待ち","プライドが高い","表面上は元気だが無理している","承認欲求が強い","空気を読みすぎる","自己犠牲型・断れない"],
  issue:["モチベが急落","ミスが増えている","転職を考えていそう","残業・疲弊が続く","人間関係でトラブル","昇進・キャリアで悩む","メンタル不調の兆候","リモートで孤立","評価制度への不満","会社の方針への不満","特に問題はなさそう"]
};
var MULTI = {personality:true,issue:true};
var sel = {industry:'',job:'',position:'',age:'',personality:[],issue:[]};
var roleCount = 0;
var roleDone = false;
var sessionStarted = false;

var VOICES = [
  "...そうですね。正直、どこから話せばいいかわからなくて。",
  "うーん...(少し考えて)まあ、なんとかやってます。",
  "頑張ろうとは思ってるんですけど、なんか空回りしてる感じがして。",
  "以前はもっとやる気あったんですけど、何かがすり減ってきてる感じで。",
  "自分でもどうしたらいいかわからなくて、それがまた辛くて。",
  "(少し間があって)こんなこと言っていいかわかりませんけど。",
  "最近ちょっと、仕事に対して気持ちが追いつかなくて。",
  "言葉にするのが難しいんですけど、なんか違うって感じが続いてて。",
  "正直に言うと、その方針って現場の実態と合ってないと思うんですけど。",
  "わかりました、とは言えるんですが、納得はしてないです。",
  "評価に納得できなくて。何をすれば評価されるのか基準が見えなくて。",
  "給料が上がらなくて。転職した方がいいんじゃないかってリアルに考えてて。",
  "大丈夫です...(少し間があって)でも最近、ちょっと寝れてなくて。",
  "将来のこと、ちゃんと考えないといけないなって思って。",
  "チームの雰囲気、正直ちょっとしんどくて。",
  "(少し沈黙)...ありがとうございます、話聞いてもらえて。",
  "なかなか言い出せなかったんですけど、実は気になってることがあって。",
  "(ゆっくりと)...はい。少し整理しながら話させてください。"
];
var usedVoices = [];

function getVoice(){
  var avail = VOICES.filter(function(v){return usedVoices.indexOf(v)<0;});
  if(avail.length===0){usedVoices=[];avail=VOICES;}
  var v = avail[Math.floor(Math.random()*avail.length)];
  usedVoices.push(v);
  return v;
}

function initChips(){
  Object.keys(OPTS).forEach(function(k){
    var el = document.getElementById('chips-'+k);
    if(!el)return;
    OPTS[k].forEach(function(o){
      var b = document.createElement('button');
      b.className='chip';
      b.textContent=o;
      b.onclick=function(){toggleChip(k,o,b);};
      el.appendChild(b);
    });
  });
}

function toggleChip(k,v,btn){
  if(MULTI[k]){
    var i=sel[k].indexOf(v);
    if(i<0){sel[k].push(v);btn.className='chip selected';}
    else{sel[k].splice(i,1);btn.className='chip';}
  } else {
    var chips=document.getElementById('chips-'+k).querySelectorAll('.chip');
    chips.forEach(function(c){c.className='chip';});
    if(sel[k]===v){sel[k]='';}
    else{sel[k]=v;btn.className='chip selected';}
  }
  checkReady();
}

function checkReady(){
  var ok = sel.industry&&sel.job&&sel.position&&sel.age&&sel.personality.length>0&&sel.issue.length>0;
  var btn = document.getElementById('start-btn');
  if(ok){btn.className='btn btn-gold';btn.textContent='このペルソナで設計・練習を開始';}
  else{btn.className='btn btn-gray';btn.textContent='全項目を選んでください';}
}

function startSession(){
  var ok = sel.industry&&sel.job&&sel.position&&sel.age&&sel.personality.length>0&&sel.issue.length>0;
  if(!ok)return;
  sessionStarted=true;
  document.getElementById('design-scroll').style.display='none';
  document.getElementById('design-chat').style.display='flex';
  var msg = buildDesign();
  addBubble('design-messages',msg,false);
  document.getElementById('progress-text').textContent='ペルソナ設定済み - 1on1を始めてください';
  initRolePlay();
}

function buildDesign(){
  var cycle = diagCycle();
  var maslow = diagMaslow();
  return "[ペルソナ]\n"+sel.age+" / "+sel.industry+" / "+sel.job+" / "+sel.position+"\n性格: "+sel.personality.join("・")+"\n状況: "+sel.issue.join("・")+"\n\n[成功循環モデル診断]\n課題ステージ: "+cycle.label+"\n"+cycle.desc+"\n今週の一手: "+cycle.action+"\n\n[マズロー欲求診断]\n優先欲求: "+maslow.name+"\n"+maslow.desc+"\n\n[今日の1on1 トーク設計]\n\nOpening:\n「最近どう？正直なところ聞かせて」\n評価せず、まず聴く姿勢を先に見せる\n\nMain(核心の問いかけ):\n1. 「最近、仕事でこれは意味があるなと思えた瞬間、あった？」\n2. 「もし今の仕事で一つだけ変えられるとしたら、何を変えたい？」\n3. 「私にもっとこうしてほしいって、何かある？」\n\nClosing:\n「話してくれてありがとう。来週また聞かせて」\n約束で関係の質を積み上げる\n\n[今週の一手]\n"+cycle.action;
}

function diagCycle(){
  var s=sel.personality.concat(sel.issue).join(' ');
  if(/人間関係|ハラスメント|トラブル/.test(s)) return{label:'関係の質',desc:'信頼関係が損なわれています。まず関係の質の回復が最優先。',action:'評価・批判ゼロで話を聞く場を週1回作る'};
  if(/モチベ|やる気|方針|評価制度/.test(s)) return{label:'思考の質',desc:'仕事の意味・方向性が見えなくなっています。',action:'なぜこの仕事が大切かを一緒に言語化する'};
  if(/ミス|疲弊|残業|品質/.test(s)) return{label:'行動の質',desc:'行動量は十分でも質や方向性がずれています。',action:'やることリストからやめることリストを作る'};
  if(/転職|キャリア|昇進/.test(s)) return{label:'結果の質',desc:'結果への焦りが思考・行動に影響しています。',action:'小さな成功体験を作り、承認して伝える'};
  return{label:'バランス良好',desc:'現時点では大きな問題はなさそうです。',action:'今日の話題を翌日フォローする一言を添える'};
}

function diagMaslow(){
  var s=sel.personality.concat(sel.issue).join(' ');
  if(/メンタル|疲弊|残業/.test(s)) return{name:'安全欲求',desc:'心身の安全が脅かされています。無理しなくていいを先に伝えて。'};
  if(/人間関係|孤立|トラブル/.test(s)) return{name:'所属・愛情欲求',desc:'チームへの帰属感が低下。ここに居ていいという安心感を作ることが最優先。'};
  if(/評価|プライド|モチベ/.test(s)) return{name:'承認欲求',desc:'認められたい欲求が満たされていません。見ている・評価しているを具体的な言葉で。'};
  if(/キャリア|昇進|転職/.test(s)) return{name:'自己実現欲求',desc:'成長・実現への欲求が高まっています。キャリアビジョンを一緒に描きましょう。'};
  return{name:'所属・愛情欲求',desc:'基本欲求は満たされています。所属感をさらに高めると自己実現への扉が開きます。'};
}

function addBubble(containerId,text,isUser){
  var c=document.getElementById(containerId);
  var d=document.createElement('div');
  d.className='bubble'+(isUser?' user':'');
  var b=document.createElement('div');
  b.className='bubble-content';
  b.textContent=text;
  d.appendChild(b);
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

function sendDesign(){
  var inp=document.getElementById('design-input');
  var t=inp.value.trim();
  if(!t)return;
  addBubble('design-messages',t,true);
  inp.value='';
  setTimeout(function(){
    addBubble('design-messages','追加アドバイス:\n\n'+sel.personality.join('・')+'タイプの'+sel.age+'には、まずあなたの話を聞きたいという姿勢を先に見せることが大切です。\n\nアドバイスより先に共感を。沈黙は10秒待つ。\n\n頑張ってるの、ちゃんと見てるよという一言が'+sel.position+'には特に刺さります。',false);
  },800);
}

function initRolePlay(){
  usedVoices=[];
  roleCount=0;
  roleDone=false;
  var c=document.getElementById('role-messages');
  c.innerHTML='';
  document.getElementById('role-end-btns').style.display='none';
  document.getElementById('role-input-area').style.display='block';
  addBubble('role-messages','[ロールプレイ開始]\n\n'+sel.age+' / '+sel.industry+' / '+sel.job+'\n'+sel.position+'\n性格: '+sel.personality.join('・')+'\n状況: '+sel.issue.join('・')+'\n\nこのペルソナの部下として話します。1on1を始めてください。(約10回でフィードバック)',false);
  updateProgress();
}

function updateProgress(){
  var pct=Math.min(100,roleCount*10);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-text').textContent='残り約'+Math.max(0,10-roleCount)+'回でフィードバック';
}

function sendRole(){
  var inp=document.getElementById('role-input');
  var t=inp.value.trim();
  if(!t||roleDone)return;
  addBubble('role-messages',t,true);
  inp.value='';
  roleCount++;
  updateProgress();
  setTimeout(function(){
    if(roleCount>=10){
      var fb=buildFeedback();
      addBubble('role-messages',fb,false);
      roleDone=true;
      document.getElementById('role-input-area').style.display='none';
      document.getElementById('role-end-btns').style.display='flex';
    } else {
      addBubble('role-messages',getVoice(),false);
    }
  },700);
}

function buildFeedback(){
  var score=Math.floor(Math.random()*30)+60;
  var grade=score>=90?'S':score>=80?'A+':score>=68?'A':score>=55?'A-':'B';
  var comments={S:'S評価達成！あなたは部下が自然に話せる最高の聴き手です！',A_plus:'A+評価！あなたの1on1は部下の本音を引き出す力があります。',A:'A評価！傾聴の姿勢はできています。自信を持って！',A_minus:'A-評価。基礎はできています。聴くに集中するだけで大きく変わります！',B:'B評価ですが、練習しているあなた自身が素晴らしい！'};
  var comment=grade==='S'?comments.S:grade==='A+'?comments.A_plus:grade==='A'?comments.A:grade==='A-'?comments.A_minus:comments.B;
  return '[ロールプレイ フィードバック]\n\n'+comment+'\n\n総合評価: '+grade+'\nスコア: '+score+'/100点\nやり取り: '+roleCount+'回\n\n成功循環モデル分析:\n今回の1on1で「'+diagCycle().label+'」への働きかけができましたか？\n'+diagCycle().desc+'\n\n次の1on1で試すこと:\n'+diagCycle().action;
}

function retryRole(){initRolePlay();}
function resetAll(){
  sessionStarted=false;
  document.getElementById('design-scroll').style.display='block';
  document.getElementById('design-chat').style.display='none';
  var msgs=document.getElementById('design-messages');
  msgs.innerHTML='';
  switchTab('design');
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(b,i){b.className='tab'+(( i===0&&t==='design')||(i===1&&t==='role')?' active':'');});
  document.getElementById('design').className='screen'+(t==='design'?' active':'');
  document.getElementById('role').className='screen'+(t==='role'?' active':'');
}

initChips();
</script>
</body>
</html>
